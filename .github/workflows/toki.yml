name: Publish to Toki
# Runs the tests, builds the game and uploads it to Toki.
# Needs the repository secret TOKI_KEY and the repository variable VITE_SERVER_URL.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["client/**", "shared/**", ".github/workflows/toki.yml"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run toki:upload
        env:
          TOKI_KEY: ${{ secrets.TOKI_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
